server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1100m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # API on the same origin as the web app: the session cookie stays first-party.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }
  location /v1/ { proxy_pass http://api:4000; proxy_set_header Host $host; }
  location = /docs { proxy_pass http://api:4000; }
  location /docs/ { proxy_pass http://api:4000; }
  location = /openapi.json { proxy_pass http://api:4000; }
  location = /health { proxy_pass http://api:4000; }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; }
}
