<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf7f1" />
    <meta
      name="description"
      content="Parlante — vídeos con avatares que hablan, a partir de un guion."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Parlante</title>
    <script>
      // Apply the stored theme before first paint (see src/lib/theme).
      (function () {
        var theme = 'light';
        try {
          var stored = localStorage.getItem('parlante.theme');
          var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          theme = stored === 'dark' || stored === 'light' ? stored : dark ? 'dark' : 'light';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
